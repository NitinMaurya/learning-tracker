<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>learning tracker</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="bar">
  <div class="brand"><span class="mark"></span>learning<span class="sub">tracker</span></div>

  <nav class="tabs" id="tabs" role="tablist" aria-label="views">
    <button data-tab="dashboard" role="tab" aria-selected="true">concepts</button>
    <button data-tab="sql" role="tab" aria-selected="false">sql</button>
  </nav>

  <div id="nowchip" class="chip" hidden></div>
  <div id="timerchip" class="chip live" hidden></div>

  <div class="right">
    <span id="status" class="chip">connecting</span>
    <button class="btn" data-action="toggle-drawer" aria-haspopup="dialog"
            title="the session log and the timer's next kind">
      sessions
    </button>
  </div>
</header>

<main>
  <section id="tab-dashboard" class="tab" role="tabpanel"></section>
  <section id="tab-sql" class="tab" role="tabpanel" hidden></section>
</main>

<input type="file" id="restoreFile" accept="application/json" hidden />

<div id="backdrop" class="scrim" data-action="close-drawer" hidden></div>

<aside id="drawer" class="drawer" role="dialog" aria-label="sessions">
  <div class="drawer-head">
    sessions
    <button class="iconbtn" data-action="close-drawer" title="close (esc)" aria-label="close sessions"></button>
  </div>
  <div id="drawer-body"></div>
</aside>

<div id="toast" class="toast" role="status" hidden></div>

<script type="module" src="app.js"></script>
</body>
</html>
